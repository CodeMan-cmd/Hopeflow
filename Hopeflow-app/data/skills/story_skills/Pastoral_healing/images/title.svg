<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EC8E3"/>
      <stop offset="55%" stop-color="#B8E4F2"/>
      <stop offset="100%" stop-color="#FDF3D8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFF7D6"/>
      <stop offset="100%" stop-color="#FFE9A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C04A"/>
      <stop offset="100%" stop-color="#C9962E"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F1E4"/>
      <stop offset="100%" stop-color="#E0D6BC"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8553E"/>
      <stop offset="100%" stop-color="#7E3A28"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- 晴朗天空 -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="512" cy="240" r="260" fill="url(#sun)"/>

  <!-- 云朵 -->
  <g fill="#FFFFFF" opacity="0.85">
    <ellipse cx="220" cy="200" rx="120" ry="36"/>
    <ellipse cx="290" cy="182" rx="80" ry="30"/>
    <ellipse cx="780" cy="260" rx="140" ry="40"/>
    <ellipse cx="850" cy="238" rx="90" ry="30"/>
  </g>

  <!-- 远山 -->
  <path d="M0 620 Q180 500 340 600 Q480 520 620 610 Q760 530 900 620 L1024 580 L1024 1024 L0 1024 Z" fill="#7BA88C"/>

  <!-- 油菜花田 -->
  <path d="M0 700 Q512 620 1024 700 L1024 1024 L0 1024 Z" fill="url(#field)"/>
  <path d="M0 780 Q512 720 1024 780 L1024 1024 L0 1024 Z" fill="#B8842E"/>
  <!-- 田埂 -->
  <path d="M300 760 Q420 740 540 765 Q660 790 780 770" stroke="#8A6420" stroke-width="6" fill="none" opacity="0.6"/>

  <!-- 小木屋 -->
  <g transform="translate(640 560)">
    <rect x="-110" y="0" width="220" height="170" fill="url(#wall)"/>
    <path d="M-150 0 L0 -130 L150 0 Z" fill="url(#roof)"/>
    <rect x="-14" y="70" width="28" height="100" fill="#7A4A28"/>
    <rect x="40" y="40" width="42" height="50" fill="#4A80B8"/>
    <line x1="61" y1="40" x2="61" y2="90" stroke="#F6F1E4" stroke-width="3"/>
    <line x1="40" y1="65" x2="82" y2="65" stroke="#F6F1E4" stroke-width="3"/>
    <rect x="-100" y="40" width="42" height="50" fill="#4A80B8"/>
    <!-- 烟囱 -->
    <rect x="80" y="-120" width="26" height="70" fill="#8A6A4A"/>
    <ellipse cx="93" cy="-128" rx="22" ry="12" fill="#D9D9D9" opacity="0.8"/>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#3A5A48" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M180 340 Q188 332 198 342 Q208 332 216 340"/>
    <path d="M300 300 Q306 294 314 302 Q322 294 328 300"/>
  </g>

  <!-- 向日葵（前景） -->
  <g transform="translate(200 820)">
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#5A7A3A" stroke-width="8"/>
    <circle cx="0" cy="-130" r="26" fill="#7A4A20"/>
    <g fill="#FFD76E">
      <ellipse cx="0" cy="-156" rx="10" ry="22"/>
      <ellipse cx="26" cy="-140" rx="10" ry="22" transform="rotate(60 26 -140)"/>
      <ellipse cx="-26" cy="-140" rx="10" ry="22" transform="rotate(-60 -26 -140)"/>
      <ellipse cx="0" cy="-104" rx="10" ry="22" transform="rotate(180 0 -104)"/>
      <ellipse cx="22" cy="-114" rx="10" ry="22" transform="rotate(120 22 -114)"/>
      <ellipse cx="-22" cy="-114" rx="10" ry="22" transform="rotate(-120 -22 -114)"/>
    </g>
  </g>

  <!-- 标题 -->
  <text x="512" y="900" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="76" font-weight="bold" fill="#5A7A3A" letter-spacing="14">田园治愈</text>
  <text x="512" y="958" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="28" fill="#7A9660" letter-spacing="6">Pastoral Healing</text>
</svg>
