<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5FB7E8"/>
      <stop offset="55%" stop-color="#8FD3F5"/>
      <stop offset="100%" stop-color="#FDF6D8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="70%" stop-color="#FFD76E"/>
      <stop offset="100%" stop-color="#FFC94D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="100%" stop-color="#FFD9A0"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7A59"/>
      <stop offset="100%" stop-color="#E84A30"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="20" flood-color="#3A7FB5" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- 明亮天空 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="780" cy="240" r="210" fill="url(#sun)"/>
  <circle cx="180" cy="180" r="40" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="340" cy="110" r="26" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="880" cy="120" r="30" fill="#FFFFFF" opacity="0.5"/>

  <!-- 云朵 -->
  <g fill="#FFFFFF" opacity="0.92">
    <ellipse cx="260" cy="250" rx="150" ry="48"/>
    <ellipse cx="330" cy="225" rx="100" ry="42"/>
    <ellipse cx="180" cy="235" rx="90" ry="38"/>
    <ellipse cx="720" cy="330" rx="130" ry="42"/>
    <ellipse cx="790" cy="308" rx="90" ry="38"/>
  </g>

  <!-- 地面 -->
  <ellipse cx="512" cy="930" rx="560" ry="110" fill="#8ADB6E"/>
  <ellipse cx="512" cy="930" rx="430" ry="80" fill="#A6E87E"/>

  <!-- 卡通角色（圆润造型） -->
  <g transform="translate(512 520)" filter="url(#shadow)">
    <!-- 身体 -->
    <ellipse cx="0" cy="200" rx="170" ry="175" fill="url(#body)"/>
    <!-- 肚皮 -->
    <ellipse cx="0" cy="225" rx="105" ry="120" fill="#FFF3D6"/>
    <!-- 头部 -->
    <circle cx="0" cy="-20" r="150" fill="url(#face)"/>
    <!-- 耳朵 -->
    <circle cx="-140" cy="-40" r="42" fill="#FFD9A0"/>
    <circle cx="140" cy="-40" r="42" fill="#FFD9A0"/>
    <circle cx="-136" cy="-42" r="20" fill="#F0B57E"/>
    <circle cx="136" cy="-42" r="20" fill="#F0B57E"/>
    <!-- 眼睛（大而有神） -->
    <ellipse cx="-58" cy="-40" rx="34" ry="40" fill="#FFFFFF"/>
    <ellipse cx="58" cy="-40" rx="34" ry="40" fill="#FFFFFF"/>
    <circle cx="-58" cy="-32" r="20" fill="#3A2A20"/>
    <circle cx="58" cy="-32" r="20" fill="#3A2A20"/>
    <circle cx="-50" cy="-40" r="7" fill="#FFFFFF"/>
    <circle cx="66" cy="-40" r="7" fill="#FFFFFF"/>
    <!-- 眉 -->
    <path d="M-96 -82 Q-58 -96 -22 -82" stroke="#5A3A22" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M22 -82 Q58 -96 96 -82" stroke="#5A3A22" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- 鼻 -->
    <ellipse cx="0" cy="8" rx="16" ry="12" fill="#F0B57E"/>
    <!-- 嘴（开心微笑） -->
    <path d="M-48 32 Q0 92 48 32 Q0 70 -48 32 Z" fill="#B8503A"/>
    <path d="M-40 44 Q0 78 40 44" stroke="#8A3A28" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 星星点缀 -->
  <g fill="#FFD76E">
    <g transform="translate(120 780)"><path d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4 Z"/></g>
    <g transform="translate(900 800)"><path d="M0 -11 L3 -3 L11 0 L3 3 L0 11 L-3 3 L-11 0 L-3 -3 Z"/></g>
    <g transform="translate(830 760)"><path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/></g>
  </g>

  <!-- 标题 -->
  <text x="512" y="120" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="72" font-weight="bold" fill="#2E5C8A" letter-spacing="8">欧美3D动画电影</text>
  <text x="512" y="176" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="30" fill="#4A7FB5" letter-spacing="6">Western 3D Animation Film</text>
</svg>
