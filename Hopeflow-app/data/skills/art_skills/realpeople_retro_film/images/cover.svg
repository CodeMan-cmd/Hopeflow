<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E2620"/>
      <stop offset="55%" stop-color="#4A3828"/>
      <stop offset="100%" stop-color="#6B5030"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFE2A8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE2A8" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
    </filter>
    <filter id="vig" x="0" y="0" width="100%" height="100%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- 褪色暖棕底 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 街灯暖光 -->
  <circle cx="512" cy="330" r="420" fill="url(#lamp)"/>

  <!-- 老城天际线 -->
  <g fill="#241C16">
    <rect x="0" y="520" width="170" height="504"/>
    <rect x="200" y="600" width="140" height="424"/>
    <rect x="360" y="480" width="160" height="544"/>
    <rect x="540" y="620" width="120" height="404"/>
    <rect x="680" y="560" width="150" height="464"/>
    <rect x="850" y="640" width="174" height="384"/>
    <!-- 楼顶水箱/天窗 -->
    <rect x="80" y="470" width="60" height="50" fill="#241C16"/>
    <rect x="400" y="420" width="70" height="60" fill="#241C16"/>
    <rect x="720" y="505" width="50" height="55" fill="#241C16"/>
  </g>

  <!-- 窗户暖光 -->
  <g fill="#FFC96B" opacity="0.8">
    <rect x="40" y="560" width="18" height="24"/>
    <rect x="90" y="560" width="18" height="24"/>
    <rect x="40" y="640" width="18" height="24"/>
    <rect x="140" y="700" width="18" height="24"/>
    <rect x="240" y="660" width="16" height="22"/>
    <rect x="280" y="660" width="16" height="22"/>
    <rect x="400" y="540" width="18" height="24"/>
    <rect x="450" y="540" width="18" height="24"/>
    <rect x="400" y="640" width="18" height="24"/>
    <rect x="580" y="680" width="16" height="22"/>
    <rect x="720" y="620" width="18" height="24"/>
    <rect x="770" y="620" width="18" height="24"/>
    <rect x="880" y="700" width="18" height="24"/>
    <rect x="940" y="700" width="18" height="24"/>
  </g>

  <!-- 路灯 -->
  <g transform="translate(300 0)">
    <rect x="0" y="430" width="10" height="200" fill="#241C16"/>
    <ellipse cx="5" cy="425" rx="42" ry="20" fill="#241C16"/>
    <circle cx="5" cy="430" r="120" fill="#FFD98A" opacity="0.35" filter="url(#soft)"/>
    <circle cx="5" cy="425" r="14" fill="#FFF3C4"/>
  </g>

  <!-- 人影（胶片剪影） -->
  <g fill="#1A140F" opacity="0.9">
    <ellipse cx="560" cy="880" rx="120" ry="34"/>
    <circle cx="560" cy="790" r="40"/>
    <path d="M528 830 L505 900 L485 900 L512 830 L520 880 L500 930 L540 930 L528 880 Z"/>
    <path d="M592 830 L615 900 L635 900 L608 830 L600 880 L620 930 L580 930 L592 880 Z"/>
  </g>

  <!-- 胶片颗粒 -->
  <rect width="1024" height="1024" filter="url(#grain)"/>

  <!-- 暗角 -->
  <rect width="1024" height="1024" filter="url(#vig)" fill="#000000" opacity="0.5"/>

  <!-- 标题（胶片感描边） -->
  <text x="512" y="300" text-anchor="middle" font-family="'STSong','SimSun',serif" font-size="76" font-weight="bold" fill="#F2E2BE" letter-spacing="10">真人复古胶片</text>
  <text x="512" y="356" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="28" fill="#C9B48E" letter-spacing="4">Retro Film · 80s Nostalgia</text>
</svg>
